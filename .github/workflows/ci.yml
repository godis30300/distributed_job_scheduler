name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  POSTGRES_DB: jobscheduler
  POSTGRES_USER: postgres
  PYTHONUNBUFFERED: "1"

jobs:
  backend-pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobscheduler
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password_${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobscheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-cov pytest-asyncio anyio

      - name: Apply database schema and migrations
        env:
          PGPASSWORD: password_${{ github.run_id }}
        run: |
          until pg_isready -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "waiting for postgres"; sleep 1; done
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/schema.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/002_db_integration_fields.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/003_postgresql_queue_integrity.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/004_task_fields_duration_metrics.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/005_db_controller_functions.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/006_remove_fixed_seed_data.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/008_add_metadata_json_and_api_poll.sql

      - name: Run backend Unit Tests
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: secret_${{ github.run_id }}
        run: |
          cd backend && PYTHONPATH=. python -m pytest tests/unit/

      - name: Run backend Integration Tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:password_${{ github.run_id }}@localhost:5432/jobscheduler
          JWT_SECRET_KEY: secret_${{ github.run_id }}
        run: |
          mkdir -p backend/test-reports
          cd backend && PYTHONPATH=. python -m pytest \
            --junitxml=test-reports/pytest.xml \
            --cov=app \
            --cov-report=xml:coverage.xml \
            tests/integration/

      - name: Upload backend test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-test-reports
          path: |
            backend/test-reports/pytest.xml
            backend/coverage.xml
