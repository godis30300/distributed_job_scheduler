name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_DB: jobscheduler
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: gh-ci-db-${{ github.run_id }}
  DATABASE_URL: postgresql+psycopg2://postgres:gh-ci-db-${{ github.run_id }}@localhost:5432/jobscheduler
  JWT_SECRET_KEY: gh-ci-jwt-${{ github.run_id }}
  CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  PYTHONUNBUFFERED: "1"

jobs:
  backend-pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobscheduler
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gh-ci-db-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobscheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-cov

      - name: Apply database schema and migrations
        env:
          PGPASSWORD: gh-ci-db-${{ github.run_id }}
        run: |
          until pg_isready -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "waiting for postgres"; sleep 1; done
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/schema.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/002_db_integration_fields.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/003_postgresql_queue_integrity.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/004_task_fields_duration_metrics.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/005_db_controller_functions.sql
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/migrations/006_remove_fixed_seed_data.sql

      - name: Run backend pytest
        run: |
          mkdir -p backend/test-reports
          python -m pytest \
            --junitxml=backend/test-reports/pytest.xml \
            --cov=backend/app \
            --cov-report=xml:backend/coverage.xml \
            backend/app/tests/test_auth_controller.py \
            backend/app/tests/test_job_controller.py \
            backend/app/tests/test_schedule_utils.py \
            backend/app/tests/test_worker_lifecycle.py

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/test-reports/pytest.xml
            backend/coverage.xml

  docker-build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs:
      - backend-pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - backend
          - frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: false
          tags: distributed-job-scheduler-${{ matrix.component }}:${{ github.sha }}

