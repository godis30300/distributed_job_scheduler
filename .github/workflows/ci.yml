name: CI

on:
  push:
    branches:
      - main
      - test/frontend/automation_test
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_DB: jobscheduler
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}
  DATABASE_URL: postgresql+psycopg2://postgres:${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}@localhost:5432/jobscheduler
  JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY || 'testsecretkey' }}
  CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  PYTHONUNBUFFERED: "1"

jobs:
  backend-pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobscheduler
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobscheduler"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-cov

      - name: Apply database schema and migrations
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}
        run: |
          until pg_isready -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "waiting for postgres"; sleep 1; done
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/schema.sql
          for f in backend/database/migrations/*.sql; do
            echo "Applying $f..."
            psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f "$f"
          done

      - name: Run backend pytest
        run: |
          cd backend
          export PYTHONPATH=$GITHUB_WORKSPACE/backend
          mkdir -p test-reports
          python -m pytest \
            --junitxml=test-reports/pytest.xml \
            --cov=app \
            --cov-report=xml:coverage.xml \
            tests

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/test-reports/pytest.xml
            backend/coverage.xml

  backend-db-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobscheduler
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobscheduler"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install smoke test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Apply database schema and migrations
        env:
          PGPASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'postgres' }}
        run: |
          until pg_isready -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo "waiting for postgres"; sleep 1; done
          psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f backend/database/schema.sql
          for f in backend/database/migrations/*.sql; do
            echo "Applying $f..."
            psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f "$f"
          done

      - name: Run DB smoke test
        run: |
          cd backend
          export PYTHONPATH=$GITHUB_WORKSPACE/backend
          python scripts/db_smoke_test.py

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt

      - name: Run frontend tests
        env:
          SECRET_KEY: "temporary_secret_key_for_testing"
        run: |
          cd frontend
          python manage.py test
