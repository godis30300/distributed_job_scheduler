stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DATABASE_URL: "postgresql+psycopg2://postgres:postgres@postgres:5432/jobscheduler"
  JWT_SECRET_KEY: "gitlab-ci-secret"
  CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
  PYTHONUNBUFFERED: "1"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

default:
  interruptible: true

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

.backend_test_base:
  image: python:3.11-slim
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: jobscheduler
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    PGPASSWORD: postgres
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends postgresql-client curl bash ca-certificates
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements.txt pytest
    - until pg_isready -h postgres -U postgres -d jobscheduler; do echo "waiting for postgres"; sleep 1; done
    - psql -h postgres -U postgres -d jobscheduler -f backend/database/schema.sql
    - psql -h postgres -U postgres -d jobscheduler -f backend/database/migrations/002_db_integration_fields.sql
    - psql -h postgres -U postgres -d jobscheduler -f backend/database/migrations/003_postgresql_queue_integrity.sql
    - psql -h postgres -U postgres -d jobscheduler -f backend/database/migrations/004_task_fields_duration_metrics.sql
    - psql -h postgres -U postgres -d jobscheduler -f backend/database/migrations/005_db_controller_functions.sql
    - psql -h postgres -U postgres -d jobscheduler -f backend/database/migrations/006_remove_fixed_seed_data.sql

backend_pytest:
  extends: .backend_test_base
  stage: test
  script:
    - cd backend
    - pytest app/tests/test_schedule_utils.py app/tests/test_worker_lifecycle.py

backend_db_smoke:
  extends: .backend_test_base
  stage: test
  script:
    - cd backend
    - python scripts/db_smoke_test.py

docker_build_backend:
  stage: build
  image: docker:27.1.1-cli
  services:
    - name: docker:27.1.1-dind
      alias: docker
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker build --pull -t "$CI_PROJECT_NAME-backend:$CI_COMMIT_SHORT_SHA" backend

docker_build_frontend:
  stage: build
  image: docker:27.1.1-cli
  services:
    - name: docker:27.1.1-dind
      alias: docker
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker build --pull -t "$CI_PROJECT_NAME-frontend:$CI_COMMIT_SHORT_SHA" frontend
