apiVersion: v1
kind: Secret
metadata:
  name: job-scheduler-secret
  namespace: job-scheduler
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/jobscheduler
  JWT_SECRET_KEY: change-me-in-production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-scheduler-config
  namespace: job-scheduler
data:
  CORS_ORIGINS: "http://localhost:5173"
  WORKER_POLL_INTERVAL_SECONDS: "3"
  SCHEDULER_POLL_INTERVAL_SECONDS: "10"
