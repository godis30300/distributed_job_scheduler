apiVersion: v1
kind: Secret
metadata:
  name: job-scheduler-secret
  namespace: job-scheduler
type: Opaque
stringData:
  DATABASE_URL: ${JOB_SCHEDULER_DATABASE_URL}
  JWT_SECRET_KEY: ${JOB_SCHEDULER_JWT_SECRET_KEY}
  POSTGRES_PASSWORD: ${JOB_SCHEDULER_POSTGRES_PASSWORD}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-scheduler-config
  namespace: job-scheduler
data:
  CORS_ORIGINS: "http://localhost:5173"
  WORKER_POLL_INTERVAL_SECONDS: "3"
  SCHEDULER_POLL_INTERVAL_SECONDS: "10"
