apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: job-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/metrics"
        prometheus.io/port: "8000"
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: registry.git.hsnl.tw/native_cloud/distributed_job_scheduler/backend:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: job-scheduler-secret
            - configMapRef:
                name: job-scheduler-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/system/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: job-scheduler
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
