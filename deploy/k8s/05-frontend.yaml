apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: job-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: registry.example.com/job-scheduler-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: job-scheduler
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
