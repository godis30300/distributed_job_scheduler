apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-scheduler-ingress
  namespace: job-scheduler
spec:
  rules:
    - host: job-scheduler.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
        - path: /locust
            pathType: Prefix
            backend:
              service:
                name: locust
                port:
                  number: 8089
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173
