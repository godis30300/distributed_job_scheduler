apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-scripts
  namespace: job-scheduler
data:
  locustfile_advanced.py: |
    import time
    import secrets
    import string
    import uuid
    import os
    from locust import HttpUser, task, between, tag

    def random_string(length=8):
        return ''.join(secrets.choice(string.ascii_lowercase + string.digits) for _ in range(length))

    class AdvancedJobSchedulerUser(HttpUser):
        wait_time = between(0.5, 2)
        
        def on_start(self):
            self.username = f"stress_{random_string()}"
            env_pass = os.getenv("LOCUST_TEST_PASSWORD")
            self.password = env_pass if env_pass else f"Pass_{uuid.uuid4().hex}"
            self.headers = {}
            self._authenticate()

        def _authenticate(self):
            reg_data = {
                "username": self.username,
                "email": f"{self.username}@stress.com",
                "password": self.password,
                "role": "admin"
            }
            self.client.post("/api/auth/register", json=reg_data)
            
            login_data = {"username": self.username, "password": self.password}
            with self.client.post("/api/auth/login", json=login_data) as resp:
                if resp.status_code == 200:
                    token = resp.json().get("access_token")
                    self.headers = {"Authorization": f"Bearer {token}"}

        def _create_and_run_job(self, name_prefix, script, task_type="shell", timeout=60, retry_limit=1):
            name = f"{name_prefix}-{uuid.uuid4().hex[:8]}"
            safe_working_dir = f"locust-work-{uuid.uuid4().hex[:12]}"
            
            payload = {
                "name": name,
                "task_type": task_type,
                "script": script,
                "description": f"stress-test-{name_prefix}",
                "working_dir": safe_working_dir,
                "schedule_type": "manual",
                "timeout_seconds": timeout,
                "retry_limit": retry_limit,
                "status": "enabled"
            }
            with self.client.post("/api/jobs", json=payload, headers=self.headers, name=f"/jobs [create {name_prefix}]") as resp:
                if resp.status_code in [200, 201]:
                    jid = resp.json().get("id")
                    self.client.post(f"/api/jobs/{jid}/run", headers=self.headers, name=f"/jobs/run [{name_prefix}]")

        @tag('success')
        @task(5)
        def stress_success_jobs(self):
            self._create_and_run_job("success", "echo 'quick success' && sleep 0.1")

        @tag('long')
        @task(3)
        def stress_long_running_jobs(self):
            self._create_and_run_job("long-run", "echo 'starting long job' && sleep 10 && echo 'finished'", timeout=30)

        @tag('retry')
        @task(3)
        def stress_retry_success_jobs(self):
            script = 'if [[ "$RETRY_COUNT" == "0" ]]; then echo "First attempt fail"; exit 1; else echo "Retry success"; exit 0; fi'
            self._create_and_run_job("retry-success", script, retry_limit=2)

        @tag('failure')
        @task(2)
        def stress_permanent_failure(self):
            self._create_and_run_job("perm-fail", "echo 'always fail'; exit 1", retry_limit=1)

        @task(5)
        def monitor_status(self):
            self.client.get("/api/dashboard/summary", headers=self.headers, name="/dashboard/summary")
            self.client.get("/api/job-runs?limit=20", headers=self.headers, name="/job-runs")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: job-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      # 安全優化：不自動掛載 ServiceAccount Token，防止權限提昇攻擊
      automountServiceAccountToken: false
      containers:
        - name: locust
          image: registry.git.hsnl.tw/native_cloud/distributed_job_scheduler/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args: 
            - "locust -f /mnt/locust/locustfile_advanced.py --host ${LOCUST_TARGET_HOST:-http://backend:8000}"
          # 維護性優化：明確定義資源限制，防止壓測過度消耗叢集資源
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - containerPort: 8089
          envFrom:
            - secretRef:
                name: job-scheduler-secret
            - configMapRef:
                name: job-scheduler-config
          env:
            - name: LOCUST_TEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-scheduler-secret
                  key: LOCUST_TEST_PASSWORD
                  optional: true
          volumeMounts:
            - name: locust-script-volume
              mountPath: /mnt/locust
      volumes:
        - name: locust-script-volume
          configMap:
            name: locust-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: locust
  namespace: job-scheduler
spec:
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089
  type: ClusterIP
