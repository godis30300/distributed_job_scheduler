<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>任務名稱</th>
        <th>Status</th>
        <th>Schedule</th>
        <th>Action</th>
        <th>Timeout</th>
        <th>Retry</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      {% for job in jobs %}
      <tr>
        <td><a href="{% url 'job_detail' job.id %}">{{ job.task_name }}</a></td>
        <td><span class="badge {{ job.status }}">{{ job.status }}</span></td>
        <td>{{ job.schedule_type }}</td>
        <td>{{ job.action }}</td>
        <td>{{ job.timeout_seconds }}s</td>
        <td>{{ job.retry_limit }}</td>
        <td class="actions">
          <form method="post" action="{% url 'job_run' job.id %}">{% csrf_token %}<button class="btn small" type="submit">Run</button></form>
          <a class="btn small" href="{% url 'job_edit' job.id %}">Edit</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="7" class="empty">目前沒有 Job。</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
