apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  imagePullSecrets:
  - name: registry-secret
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: registry.git.hsnl.tw/native_cloud/distributed_job_scheduler/backend
        envFrom:
        - secretRef:
            name: job-scheduler-secret
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
