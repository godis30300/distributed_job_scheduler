apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-sql
data:
  01-schema.sql: |
    -- PostgreSQL schema for Distributed Asynchronous Job Scheduler
    -- Owner module: PostgreSQL / Log / DB Controller
    -- This schema is aligned with backend/app/models and the FastAPI contract.
    -- Owner: ?��?｜PostgreSQL / Log / DB Controller

    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    CREATE TABLE IF NOT EXISTS users (
        id VARCHAR(36) PRIMARY KEY,
        username VARCHAR(80) NOT NULL UNIQUE,
        email VARCHAR(255) UNIQUE,
        password_hash VARCHAR(255) NOT NULL,
        role VARCHAR(32) NOT NULL DEFAULT 'operator',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CONSTRAINT ck_users_role CHECK (role IN ('admin', 'developer', 'operator', 'viewer'))
    );

    CREATE TABLE IF NOT EXISTS jobs (
        id VARCHAR(36) PRIMARY KEY,
        user_id VARCHAR(36) REFERENCES users(id) ON DELETE SET NULL,
        name VARCHAR(120),
        task_name VARCHAR(120) NOT NULL UNIQUE,
        task_type VARCHAR(40),
        script TEXT,
        working_dir TEXT,
        action_type VARCHAR(40) NOT NULL,
        action_payload JSONB NOT NULL DEFAULT '{}'::jsonb,
        schedule_rule VARCHAR(120) NOT NULL,
        status VARCHAR(32) NOT NULL DEFAULT 'enabled',
        enabled BOOLEAN NOT NULL DEFAULT TRUE,
        timeout_seconds INTEGER NOT NULL DEFAULT 300,
        max_retry INTEGER NOT NULL DEFAULT 3,
        description TEXT,
        next_run_at TIMESTAMPTZ,
        last_run_at TIMESTAMPTZ,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CONSTRAINT ck_jobs_action_type CHECK (action_type IN ('api_call', 'shell', 'python', 'report', 'email', 'backup', 'fail-test', 'long-task')),
        CONSTRAINT ck_jobs_task_type CHECK (task_type IS NULL OR task_type IN ('api_call', 'shell', 'python', 'report', 'email', 'backup', 'fail-test', 'long-task')),
        CONSTRAINT ck_jobs_status CHECK (status IN ('enabled', 'active', 'paused', 'disabled', 'deleted')),
        CONSTRAINT ck_jobs_timeout_positive CHECK (timeout_seconds > 0),
        CONSTRAINT ck_jobs_max_retry_nonnegative CHECK (max_retry >= 0)
    );

    CREATE TABLE IF NOT EXISTS job_runs (
        id VARCHAR(36) PRIMARY KEY,
        job_id VARCHAR(36) NOT NULL REFERENCES jobs(id) ON DELETE CASCADE,
        user_id VARCHAR(36) REFERENCES users(id) ON DELETE SET NULL,
        status VARCHAR(32) NOT NULL DEFAULT 'pending',
        trigger_type VARCHAR(32) NOT NULL DEFAULT 'schedule',
        triggered_by VARCHAR(80),
        worker_id VARCHAR(80),
        locked_by VARCHAR(80),
        locked_until TIMESTAMPTZ,
        start_time TIMESTAMPTZ,
        end_time TIMESTAMPTZ,
        heartbeat_at TIMESTAMPTZ,
        duration_seconds INTEGER,
        duration_seconds_decimal DOUBLE PRECISION,
        duration_ms INTEGER,
        retry_count INTEGER NOT NULL DEFAULT 0,
        task_type VARCHAR(40),
        script TEXT,
        working_dir TEXT,
        action_type VARCHAR(40) NOT NULL,
        action_payload JSONB,
        timeout_seconds INTEGER NOT NULL DEFAULT 300,
        stdout TEXT,
        stderr TEXT,
        error_message TEXT,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CONSTRAINT ck_job_runs_status CHECK (status IN ('pending', 'running', 'success', 'failed', 'timeout', 'canceled')),
        CONSTRAINT ck_job_runs_trigger_type CHECK (trigger_type IN ('schedule', 'manual', 'api', 'retry', 'dependency')),
        CONSTRAINT ck_job_runs_retry_count_nonnegative CHECK (retry_count >= 0),
        CONSTRAINT ck_job_runs_action_type CHECK (action_type IN ('api_call', 'shell', 'python', 'report', 'email', 'backup', 'fail-test', 'long-task')),
        CONSTRAINT ck_job_runs_task_type CHECK (task_type IS NULL OR task_type IN ('api_call', 'shell', 'python', 'report', 'email', 'backup', 'fail-test', 'long-task')),
        CONSTRAINT ck_job_runs_timeout_positive CHECK (timeout_seconds > 0)
    );

    CREATE TABLE IF NOT EXISTS job_logs (
        id VARCHAR(36) PRIMARY KEY,
        job_run_id VARCHAR(36) NOT NULL REFERENCES job_runs(id) ON DELETE CASCADE,
        log_level VARCHAR(20) NOT NULL DEFAULT 'info',
        stream VARCHAR(20) NOT NULL DEFAULT 'system',
        message TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CONSTRAINT ck_job_logs_level CHECK (log_level IN ('debug', 'info', 'warning', 'error')),
        CONSTRAINT ck_job_logs_stream CHECK (stream IN ('stdout', 'stderr', 'system'))
    );

    CREATE TABLE IF NOT EXISTS job_dependencies (
        id VARCHAR(36) PRIMARY KEY,
        job_id VARCHAR(36) NOT NULL REFERENCES jobs(id) ON DELETE CASCADE,
        depends_on_job_id VARCHAR(36) NOT NULL REFERENCES jobs(id) ON DELETE CASCADE,
        required_status VARCHAR(32) NOT NULL DEFAULT 'success',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
        CONSTRAINT uq_job_dependencies_pair UNIQUE (job_id, depends_on_job_id),
        CONSTRAINT ck_job_dependencies_not_self CHECK (job_id <> depends_on_job_id),
        CONSTRAINT ck_job_dependencies_required_status CHECK (required_status IN ('success', 'failed', 'timeout', 'canceled'))
    );

    CREATE INDEX IF NOT EXISTS idx_jobs_status ON jobs(status);
    CREATE INDEX IF NOT EXISTS idx_jobs_enabled_status_next_run_at ON jobs(enabled, status, next_run_at);
    CREATE INDEX IF NOT EXISTS idx_jobs_user_id ON jobs(user_id);
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_jobs_next_run_at ON jobs(next_run_at);
    CREATE INDEX IF NOT EXISTS idx_jobs_task_name ON jobs(task_name);
    CREATE INDEX IF NOT EXISTS idx_jobs_name ON jobs(name);
    CREATE INDEX IF NOT EXISTS idx_jobs_task_type ON jobs(task_type);
    CREATE INDEX IF NOT EXISTS idx_jobs_due_schedule
        ON jobs(next_run_at)
        WHERE enabled = TRUE AND status IN ('enabled', 'active') AND next_run_at IS NOT NULL;

    CREATE INDEX IF NOT EXISTS idx_job_runs_status_created_at ON job_runs(status, created_at);
    CREATE INDEX IF NOT EXISTS idx_job_runs_pending_queue ON job_runs(created_at) WHERE status = 'pending';
    CREATE INDEX IF NOT EXISTS idx_job_runs_job_id ON job_runs(job_id);
    CREATE INDEX IF NOT EXISTS idx_job_runs_job_status_created_at ON job_runs(job_id, status, created_at);
    CREATE INDEX IF NOT EXISTS idx_job_runs_user_id ON job_runs(user_id);
    CREATE INDEX IF NOT EXISTS idx_job_runs_user_start_time ON job_runs(user_id, start_time);
    CREATE INDEX IF NOT EXISTS idx_job_runs_start_time ON job_runs(start_time);
    CREATE INDEX IF NOT EXISTS idx_job_runs_locked_until ON job_runs(locked_until);
    CREATE INDEX IF NOT EXISTS idx_job_runs_task_type_created_at ON job_runs(task_type, created_at);
    CREATE INDEX IF NOT EXISTS idx_job_runs_running_locks
        ON job_runs(locked_until)
        WHERE status = 'running' AND locked_until IS NOT NULL;

    CREATE INDEX IF NOT EXISTS idx_job_logs_run_created_at ON job_logs(job_run_id, created_at);
    CREATE INDEX IF NOT EXISTS idx_job_logs_level_created_at ON job_logs(log_level, created_at);
    CREATE INDEX IF NOT EXISTS idx_job_logs_created_at ON job_logs(created_at);

    CREATE INDEX IF NOT EXISTS idx_job_dependencies_job_id ON job_dependencies(job_id);
    CREATE INDEX IF NOT EXISTS idx_job_dependencies_depends_on_job_id ON job_dependencies(depends_on_job_id);

    CREATE OR REPLACE FUNCTION set_updated_at()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = now();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS trg_jobs_updated_at ON jobs;
    CREATE TRIGGER trg_jobs_updated_at
    BEFORE UPDATE ON jobs
    FOR EACH ROW
    EXECUTE FUNCTION set_updated_at();

    DROP TRIGGER IF EXISTS trg_job_runs_updated_at ON job_runs;
    CREATE TRIGGER trg_job_runs_updated_at
    BEFORE UPDATE ON job_runs
    FOR EACH ROW
    EXECUTE FUNCTION set_updated_at();

    CREATE OR REPLACE FUNCTION set_job_run_duration_seconds()
    RETURNS TRIGGER AS $$
    BEGIN
        IF NEW.start_time IS NOT NULL AND NEW.end_time IS NOT NULL THEN
            NEW.duration_ms = GREATEST(1, CEIL(EXTRACT(EPOCH FROM (NEW.end_time - NEW.start_time)) * 1000)::INTEGER);
            NEW.duration_seconds_decimal = ROUND((NEW.duration_ms / 1000.0)::numeric, 3)::DOUBLE PRECISION;
            NEW.duration_seconds = GREATEST(1, CEIL(EXTRACT(EPOCH FROM (NEW.end_time - NEW.start_time)))::INTEGER);
        END IF;
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS trg_job_runs_duration_seconds ON job_runs;
    CREATE TRIGGER trg_job_runs_duration_seconds
    BEFORE INSERT OR UPDATE OF start_time, end_time ON job_runs
    FOR EACH ROW
    EXECUTE FUNCTION set_job_run_duration_seconds();

    CREATE OR REPLACE FUNCTION db_create_job(
        p_user_id VARCHAR,
        p_name VARCHAR,
        p_task_type VARCHAR,
        p_script TEXT,
        p_description TEXT DEFAULT NULL,
        p_working_dir TEXT DEFAULT NULL,
        p_schedule_rule VARCHAR DEFAULT 'manual',
        p_timeout_seconds INTEGER DEFAULT 300,
        p_max_retry INTEGER DEFAULT 3,
        p_status VARCHAR DEFAULT 'enabled',
        p_action_payload JSONB DEFAULT NULL
    )
    RETURNS jobs AS $$
    DECLARE
        inserted_job jobs;
    BEGIN
        INSERT INTO jobs (
            id,
            user_id,
            name,
            task_name,
            task_type,
            script,
            working_dir,
            action_type,
            action_payload,
            schedule_rule,
            status,
            enabled,
            timeout_seconds,
            max_retry,
            description
        )
        VALUES (
            gen_random_uuid()::text,
            p_user_id,
            p_name,
            p_name,
            p_task_type,
            p_script,
            p_working_dir,
            p_task_type,
            COALESCE(p_action_payload, jsonb_build_object('script', p_script, 'working_dir', p_working_dir)),
            p_schedule_rule,
            p_status,
            p_status IN ('enabled', 'active'),
            p_timeout_seconds,
            p_max_retry,
            p_description
        )
        RETURNING * INTO inserted_job;

        RETURN inserted_job;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION db_create_job_run(
        p_job_id VARCHAR,
        p_user_id VARCHAR DEFAULT NULL,
        p_trigger_type VARCHAR DEFAULT 'manual',
        p_triggered_by VARCHAR DEFAULT NULL,
        p_retry_count INTEGER DEFAULT 0
    )
    RETURNS job_runs AS $$
    DECLARE
        source_job jobs;
        inserted_run job_runs;
    BEGIN
        SELECT * INTO source_job
        FROM jobs
        WHERE id = p_job_id;

        IF NOT FOUND THEN
            RAISE EXCEPTION 'job not found: %', p_job_id;
        END IF;

        INSERT INTO job_runs (
            id,
            job_id,
            user_id,
            status,
            trigger_type,
            triggered_by,
            retry_count,
            task_type,
            script,
            working_dir,
            action_type,
            action_payload,
            timeout_seconds
        )
        VALUES (
            gen_random_uuid()::text,
            source_job.id,
            COALESCE(p_user_id, source_job.user_id),
            'pending',
            p_trigger_type,
            COALESCE(p_triggered_by, p_trigger_type),
            p_retry_count,
            COALESCE(source_job.task_type, source_job.action_type),
            source_job.script,
            source_job.working_dir,
            source_job.action_type,
            source_job.action_payload,
            source_job.timeout_seconds
        )
        RETURNING * INTO inserted_run;

        RETURN inserted_run;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION db_save_job_log(
        p_job_run_id VARCHAR,
        p_log_level VARCHAR,
        p_message TEXT,
        p_stream VARCHAR DEFAULT 'system'
    )
    RETURNS job_logs AS $$
    DECLARE
        inserted_log job_logs;
        normalized_level VARCHAR;
    BEGIN
        normalized_level := lower(p_log_level);
        IF normalized_level = 'warn' THEN
            normalized_level := 'warning';
        END IF;

        INSERT INTO job_logs (id, job_run_id, log_level, stream, message)
        VALUES (gen_random_uuid()::text, p_job_run_id, normalized_level, p_stream, p_message)
        RETURNING * INTO inserted_log;

        RETURN inserted_log;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION db_lock_pending_job(
        p_worker_id VARCHAR,
        p_lock_seconds INTEGER DEFAULT 3600
    )
    RETURNS job_runs AS $$
    DECLARE
        selected_run_id VARCHAR;
        locked_run job_runs;
    BEGIN
        SELECT jr.id INTO selected_run_id
        FROM job_runs jr
        JOIN jobs j ON j.id = jr.job_id
        WHERE jr.status = 'pending'
          AND j.enabled = TRUE
          AND j.status IN ('enabled', 'active')
        ORDER BY jr.created_at
        FOR UPDATE SKIP LOCKED
        LIMIT 1;

        IF selected_run_id IS NULL THEN
            RETURN NULL;
        END IF;

        UPDATE job_runs
        SET
            status = 'running',
            worker_id = p_worker_id,
            locked_by = p_worker_id,
            locked_until = now() + make_interval(secs => p_lock_seconds),
            start_time = COALESCE(start_time, now()),
            heartbeat_at = now()
        WHERE id = selected_run_id
        RETURNING * INTO locked_run;

        PERFORM db_save_job_log(locked_run.id, 'info', 'Locked by ' || p_worker_id, 'system');
        RETURN locked_run;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION db_update_job_run_status(
        p_run_id VARCHAR,
        p_status VARCHAR,
        p_stdout TEXT DEFAULT NULL,
        p_stderr TEXT DEFAULT NULL,
        p_error_message TEXT DEFAULT NULL
    )
    RETURNS job_runs AS $$
    DECLARE
        updated_run job_runs;
    BEGIN
        IF p_status NOT IN ('pending', 'running', 'success', 'failed', 'timeout', 'canceled') THEN
            RAISE EXCEPTION 'invalid job run status: %', p_status;
        END IF;

        UPDATE job_runs
        SET
            status = p_status,
            start_time = CASE WHEN p_status = 'running' THEN COALESCE(start_time, now()) ELSE start_time END,
            end_time = CASE WHEN p_status IN ('success', 'failed', 'timeout', 'canceled') THEN now() ELSE end_time END,
            heartbeat_at = CASE WHEN p_status IN ('running', 'success', 'failed', 'timeout', 'canceled') THEN now() ELSE heartbeat_at END,
            locked_by = CASE WHEN p_status IN ('success', 'failed', 'timeout', 'canceled') THEN NULL ELSE locked_by END,
            locked_until = CASE WHEN p_status IN ('success', 'failed', 'timeout', 'canceled') THEN NULL ELSE locked_until END,
            stdout = COALESCE(p_stdout, stdout),
            stderr = COALESCE(p_stderr, stderr),
            error_message = COALESCE(p_error_message, error_message)
        WHERE id = p_run_id
        RETURNING * INTO updated_run;

        IF NOT FOUND THEN
            RAISE EXCEPTION 'job run not found: %', p_run_id;
        END IF;

        IF p_stdout IS NOT NULL AND p_stdout <> '' THEN
            PERFORM db_save_job_log(p_run_id, 'info', p_stdout, 'stdout');
        END IF;
        IF p_stderr IS NOT NULL AND p_stderr <> '' THEN
            PERFORM db_save_job_log(p_run_id, 'error', p_stderr, 'stderr');
        END IF;
        IF p_error_message IS NOT NULL AND p_error_message <> '' THEN
            PERFORM db_save_job_log(p_run_id, 'error', p_error_message, 'system');
        END IF;
        IF p_status IN ('success', 'failed', 'timeout', 'canceled') THEN
            PERFORM db_save_job_log(p_run_id, CASE WHEN p_status = 'success' THEN 'info' ELSE 'error' END, 'Run finished: ' || p_status, 'system');
        END IF;

        SELECT * INTO updated_run FROM job_runs WHERE id = p_run_id;
        RETURN updated_run;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION db_create_dependency(
        p_job_id VARCHAR,
        p_depends_on_job_id VARCHAR,
        p_required_status VARCHAR DEFAULT 'success'
    )
    RETURNS job_dependencies AS $$
    DECLARE
        inserted_dependency job_dependencies;
    BEGIN
        IF p_job_id = p_depends_on_job_id THEN
            RAISE EXCEPTION 'job cannot depend on itself';
        END IF;

        INSERT INTO job_dependencies (id, job_id, depends_on_job_id, required_status)
        VALUES (gen_random_uuid()::text, p_job_id, p_depends_on_job_id, p_required_status)
        ON CONFLICT (job_id, depends_on_job_id)
        DO UPDATE SET required_status = EXCLUDED.required_status
        RETURNING * INTO inserted_dependency;

        RETURN inserted_dependency;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION db_check_dependency_finished(p_job_id VARCHAR)
    RETURNS BOOLEAN AS $$
    DECLARE
        dependency_row job_dependencies;
        latest_status VARCHAR;
    BEGIN
        FOR dependency_row IN
            SELECT * FROM job_dependencies WHERE job_id = p_job_id
        LOOP
            SELECT status INTO latest_status
            FROM job_runs
            WHERE job_id = dependency_row.depends_on_job_id
            ORDER BY created_at DESC
            LIMIT 1;

            IF latest_status IS NULL OR latest_status <> dependency_row.required_status THEN
                RETURN FALSE;
            END IF;
        END LOOP;

        RETURN TRUE;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE FUNCTION db_search_job_logs(
        p_task_name VARCHAR DEFAULT NULL,
        p_status VARCHAR DEFAULT NULL,
        p_user_id VARCHAR DEFAULT NULL,
        p_log_level VARCHAR DEFAULT NULL,
        p_limit INTEGER DEFAULT 100,
        p_offset INTEGER DEFAULT 0
    )
    RETURNS TABLE (
        log_id VARCHAR,
        job_run_id VARCHAR,
        job_id VARCHAR,
        task_name VARCHAR,
        run_status VARCHAR,
        log_level VARCHAR,
        stream VARCHAR,
        message TEXT,
        log_created_at TIMESTAMPTZ
    ) AS $$
    BEGIN
        RETURN QUERY
        SELECT
            jl.id,
            jr.id,
            j.id,
            j.task_name,
            jr.status,
            jl.log_level,
            jl.stream,
            jl.message,
            jl.created_at
        FROM job_logs jl
        JOIN job_runs jr ON jr.id = jl.job_run_id
        JOIN jobs j ON j.id = jr.job_id
        WHERE (p_task_name IS NULL OR j.task_name = p_task_name)
          AND (p_status IS NULL OR jr.status = p_status)
          AND (p_user_id IS NULL OR jr.user_id = p_user_id)
          AND (p_log_level IS NULL OR jl.log_level = lower(p_log_level))
        ORDER BY jl.created_at DESC
        LIMIT p_limit
        OFFSET p_offset;
    END;
    $$ LANGUAGE plpgsql;

    CREATE OR REPLACE VIEW v_job_run_log_search AS
    SELECT
        jl.id AS log_id,
        jl.log_level,
        jl.stream,
        jl.message,
        jl.created_at AS log_created_at,
        jr.id AS job_run_id,
        jr.status AS run_status,
        jr.trigger_type,
        jr.triggered_by,
        jr.worker_id,
        jr.start_time,
        jr.end_time,
        jr.duration_seconds,
        jr.duration_seconds_decimal,
        jr.duration_ms,
        jr.retry_count,
        jr.task_type,
        jr.script,
        jr.working_dir,
        jr.error_message,
        j.id AS job_id,
        j.name,
        j.task_name,
        j.action_type,
        j.schedule_rule,
        u.id AS user_id,
        u.username,
        u.email
    FROM job_logs jl
    JOIN job_runs jr ON jr.id = jl.job_run_id
    JOIN jobs j ON j.id = jr.job_id
    LEFT JOIN users u ON u.id = jr.user_id;

    CREATE OR REPLACE VIEW v_job_queue_status AS
    SELECT
        status,
        COUNT(*) AS run_count,
        MIN(created_at) AS oldest_created_at,
        MAX(created_at) AS newest_created_at
    FROM job_runs
    GROUP BY status;


  02-seed.sql: |
    -- Production seed file.
    --
    -- This project intentionally does not create default users, passwords, jobs,
    -- job runs, logs, or dependencies here.  
    -- Real accounts must be created through:
    --   POST /api/auth/register
    --
    -- Password hashes are generated by the backend with bcrypt in
    -- app.core.security.hash_password() and stored in users.password_hash.

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: job-scheduler-secret
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/jobscheduler
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  PYTHONUNBUFFERED: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: "jobscheduler"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: job-scheduler-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
        - name: db-init
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "jobscheduler"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 20
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: db-pvc
      - name: db-init
        configMap:
          name: db-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
  - port: 5432

