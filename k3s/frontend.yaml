apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ctaihsnl/cloudfinal-frontend:1.3.2
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "python3 manage.py migrate && gunicorn scheduler_frontend.wsgi:application --bind 0.0.0.0:8000"]
        env:
        - name: DJANGO_ALLOWED_HOSTS
          value: "*"
        - name: ALLOWED_HOSTS
          value: "*"
        - name: BACKEND_API_URL
          value: "http://backend:8000/api"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: frontend-secret
              key: SECRET_KEY
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30081
