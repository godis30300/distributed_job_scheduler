apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  imagePullSecrets:
  - name: registry-secret
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
      - name: scheduler
        image: ctaihsnl/cloudfinal-backend:1.2.0
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.services.scheduler_loop"]
        envFrom:
        - secretRef:
            name: job-scheduler-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  imagePullSecrets:
  - name: registry-secret
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: ctaihsnl/cloudfinal-backend:1.2.0
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.services.worker_loop"]
        env:
        - name: WORKER_ID
          value: "worker-k8s-1"
        envFrom:
        - secretRef:
            name: job-scheduler-secret
