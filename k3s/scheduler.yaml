apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: scheduler
        image: registry.git.hsnl.tw/native_cloud/distributed_job_scheduler/backend
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.services.scheduler_loop"]
        env:
        - name: DATABASE_URL
          value: "postgresql+psycopg2://postgres:postgres@db:5432/jobscheduler"
        - name: JWT_SECRET_KEY
          value: "change-me-in-production"
        - name: PYTHONUNBUFFERED
          value: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: worker
        image: registry.git.hsnl.tw/native_cloud/distributed_job_scheduler/backend
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.services.worker_loop"]
        env:
        - name: DATABASE_URL
          value: "postgresql+psycopg2://postgres:postgres@db:5432/jobscheduler"
        - name: JWT_SECRET_KEY
          value: "change-me-in-production"
        - name: WORKER_ID
          value: "worker-k8s-1"
        - name: PYTHONUNBUFFERED
          value: "1"
