prometheus:
  url: http://prometheus-kube-prometheus-prometheus.monitoring.svc
  port: 9090

rules:
  custom:
  - seriesQuery: 'nginx_ingress_controller_nginx_process_requests_total{namespace!=""}'
    resources:
      overrides:
        namespace:
          resource: namespace
    name:
      matches: "nginx_ingress_controller_nginx_process_requests_total"
      as: "http_requests_per_second"
    metricsQuery: 'sum(rate(nginx_ingress_controller_nginx_process_requests_total{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
